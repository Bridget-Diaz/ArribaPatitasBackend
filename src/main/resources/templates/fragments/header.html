<header>
	<div class="brand">
		<div class="logo"><i class="fa-solid fa-paw"></i></div>
		<span>Arriba Patitas</span>
	</div>

    <nav>
        <ul>
			<li><a th:href="@{/menu}">SERVICIOS</a></li>
			<li><a th:href="@{/productos}">PRODUCTOS</a></li>
			<li><a th:href="@{/pedido/mis-pedidos}">MIS PEDIDOS</a></li>
			<li><a th:href="@{/mis-citas}">MIS CITAS</a></li>
			<li>				<a th:href="@{/carrito}">
							        🛒 Carrito
							        <span th:if="${session.carritoCantidad != null}"
							              th:text="'(' + ${session.carritoCantidad} + ')'">
							        </span>
							    </a></li>
        </ul>
    </nav>

	<div class="header-buttons">
		<!-- Usuario autenticado -->
		<div th:if="${#authorization.expression('isAuthenticated()')}"
			style="display: flex; align-items: center; gap: 10px;">
			<a th:href="@{/miperfil}">
				<button class="btn-login">
					<i class="fas fa-user"></i> PERFIL
				</button>
			</a>

			<!-- Formulario simple -->
			<form th:action="@{/logout}" method="post" style="margin: 0;">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<button class="btn-logout" type="submit">
					<i class="fas fa-sign-out-alt"></i> SALIR
				</button>
			</form>
		</div>
	</div>
</header>
