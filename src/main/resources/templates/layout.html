<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
		:root {
					--bg-dark: #fef6ed;
					--white: #ffffff;
					--light-gray: #ededf1;
					--accent: #ff9800;
					--muted: #bdbdbd;
					--text-dark: #333333;
				}

				/* Reset */
				* {
					box-sizing: border-box;
					margin: 0;
					padding: 0
				}

				html,
				body {
					height: 100%
				}

				body {
					font-family: "Poppins", sans-serif;
					background: var(--bg-dark);
					color: var(--text-dark);
					-webkit-font-smoothing: antialiased;
					-moz-osx-font-smoothing: grayscale;
					line-height: 1.4;
				}

				#chat-window {
				    transition: all 0.3s ease-in-out;
				    display: none; /* Se cambia a 'flex' por JS */
				}
				
				
				/* Animación de los puntitos */
				.typing {
				    display: flex;
				    gap: 4px;
				    padding: 10px;
				    background: #eee;
				    border-radius: 15px 15px 15px 0;
				    width: fit-content;
				}

				.dot {
				    width: 8px;
				    height: 8px;
				    background: #888;
				    border-radius: 50%;
				    animation: bounce 1.3s linear infinite;
				}

				.dot:nth-child(2) { animation-delay: -1.1s; }
				.dot:nth-child(3) { animation-delay: -0.9s; }

				@keyframes bounce {
				    0%, 60%, 100% { transform: translateY(0); }
				    30% { transform: translateY(-6px); }
				}
				
						
				a {
					color: inherit;
					text-decoration: none
				}

				img {
					max-width: 100%;
					display: block
				}

				/* ---------- NAV (fixed) ---------- */
				header {
					position: fixed;
					left: 0;
					right: 0;
					top: 0;
					height: 72px;
					z-index: 999;
					display: flex;
					align-items: center;
					justify-content: space-between;
					padding: 0 34px;
					background: var(--white);
					box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
				}

				.brand {
					display: flex;
					align-items: center;
					gap: 12px;
				}

				.brand .logo {
					width: 44px;
					height: 44px;
					border-radius: 10px;
					background: linear-gradient(135deg, var(--accent), #f58500);
					display: flex;
					align-items: center;
					justify-content: center;
					box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
				}

				.brand .logo i {
					color: #fff;
					font-size: 18px
				}

				.brand span {
					font-weight: 700;
					color: #222;
					font-size: 18px;
					letter-spacing: 0.6px
				}

				nav ul {
					display: flex;
					gap: 26px;
					list-style: none;
					align-items: center;
				}

				nav ul li a {
					font-weight: 600;
					color: #222;
					font-size: 14px
				}

				nav ul li a:hover {
					color: var(--accent)
				}

				.btn-login {
					background: var(--accent);
					color: #fff;
					padding: 8px 16px;
					border-radius: 22px;
					font-weight: 700;
					border: none;
					cursor: pointer;
					margin-left: 10px;
				}

				.btn-logout {
					background: #dc3545;
					color: #fff;
					padding: 8px 16px;
					border-radius: 22px;
					font-weight: 700;
					border: none;
					cursor: pointer;
					margin-left: 10px;
				}

				/* ---------- Hero (white platform) ---------- */
				.hero-wrap {
					margin-top: 72px;
					display: flex;
					justify-content: center;
					position: relative;
					z-index: 1;
				}

				.hero-platform {
					width: 100%;
					max-width: 820px;
					background: var(--white);
					border-radius: 28px;
					margin-top: 24px;
					text-align: center;
					padding: 36px 28px 46px;
					position: relative;
					overflow: visible;
				}

				.hero-platform h1 {
					font-size: 48px;
					letter-spacing: 1px;
					margin-bottom: 6px;
					font-weight: 800;
				}

				.hero-platform h1 span {
					color: var(--accent)
				}

				.welcome-message {
					font-size: 20px;
					color: var(--accent);
					font-weight: 600;
					margin: 15px 0;
				}

				.user-role {
					background: var(--accent);
					color: white;
					padding: 6px 16px;
					border-radius: 20px;
					font-size: 14px;
					font-weight: 600;
					display: inline-block;
					margin: 10px 0;
				}

				.hero-platform .paw-icon {
					display: inline-block;
					margin: 14px 0 10px;
					color: var(--accent);
					font-size: 22px;
				}

				.hero-animals {
					margin-top: 14px;
					width: 100%;
					display: block;
					object-fit: cover;
					border-radius: 10px;
				}

				.hero-platform::before {
					content: "";
					position: absolute;
					left: 50%;
					transform: translateX(-50%);
					bottom: -31px;
					width: 100%;
					height: 46px;
					background: rgba(0, 0, 0, 0.06);
					border-radius: 50%;
					z-index: -3;
				}

				/* ---------- User Actions Platform ---------- */
				.user-actions-section {
					position: relative;
					margin-top: 110px;
				}

				.user-actions-platform {
					max-width: 920px;
					margin: 0 auto;
					background: var(--light-gray);
					border-radius: 28px;
					padding: 56px 42px;
					text-align: center;
					position: relative;
					z-index: 3;
				}

				.user-actions-platform h2 {
					font-size: 36px;
					color: #3a3a3a;
					font-weight: 800;
					margin-bottom: 18px;
				}

				.user-actions-grid {
					display: grid;
					grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
					gap: 30px;
					margin-top: 40px;
				}

				.user-action-card {
					background: var(--white);
					border-radius: 18px;
					padding: 30px;
					text-align: center;
					box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
					transition: transform 0.3s ease;
				}

				.user-action-card:hover {
					transform: translateY(-5px);
				}

				.user-action-icon {
					width: 70px;
					height: 70px;
					background: linear-gradient(135deg, var(--accent), #f58500);
					border-radius: 50%;
					display: flex;
					align-items: center;
					justify-content: center;
					margin: 0 auto 20px;
				}

				.user-action-icon i {
					color: white;
					font-size: 24px;
				}

				.user-action-card h3 {
					font-size: 20px;
					font-weight: 700;
					margin-bottom: 15px;
					color: var(--text-dark);
				}

				.user-action-card p {
					color: #666;
					margin-bottom: 20px;
					line-height: 1.5;
				}

				.btn-action {
					background: var(--accent);
					color: white;
					border: none;
					padding: 10px 24px;
					border-radius: 25px;
					font-weight: 600;
					cursor: pointer;
					transition: background 0.3s ease;
				}

				.btn-action:hover {
					background: #e68900;
				}

				.user-actions-platform::before {
					content: "";
					position: absolute;
					left: 50%;
					transform: translateX(-50%);
					bottom: -100px;
					width: 92%;
					height: 36px;
					background: rgba(0, 0, 0, 0.06);
					border-radius: 50%;
					z-index: -3;
				}

				/* ---------- Appointments Section ---------- */
				.appointments-section {
					margin-top: 140px;
					text-align: center;
					padding: 48px 18px 18px;
				}

				.appointments-title {
					color: var(--muted);
					font-size: 20px;
					margin-bottom: 22px;
					font-weight: 800;
				}

				.appointments-platform {
					max-width: 960px;
					margin: 0 auto;
					background: var(--white);
					border-radius: 28px;
					padding: 42px 28px;
					position: relative;
				}

				.appointments-platform h2 {
					font-size: 34px;
					color: var(--text-dark);
					font-weight: 800;
					margin-bottom: 26px;
				}

				.appointments-list {
					text-align: left;
				}

				.appointment-item {
					background: var(--light-gray);
					border-radius: 12px;
					padding: 20px;
					margin-bottom: 15px;
					border-left: 4px solid var(--accent);
				}

				.appointment-date {
					font-weight: 700;
					color: var(--accent);
					margin-bottom: 5px;
				}

				.appointment-service {
					font-weight: 600;
					color: var(--text-dark);
				}

				.no-appointments {
					text-align: center;
					color: var(--muted);
					font-style: italic;
					padding: 40px;
				}

				/* ---------- Gallery platform ---------- */
				.gallery-wrap {
					margin-top: 80px;
					position: relative;
					padding-bottom: 0;
				}

				.gallery-platform {
					max-width: 960px;
					margin: 0 auto;
					background: var(--white);
					border-radius: 28px;
					padding: 42px 28px 90px;
					text-align: center;
					position: relative;
				}

				.gallery-platform h2 {
					font-size: 34px;
					color: var(--text-dark);
					font-weight: 800;
					margin-bottom: 26px
				}

				.gallery-grid {
					display: grid;
					grid-template-columns: repeat(4, 1fr);
					gap: 18px;
					align-items: start;
				}

				.gallery-grid .tile {
					aspect-ratio: 1 / 1;
					border-radius: 10px;
					overflow: hidden;
					position: relative;
					box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
					background: #f6f6f6;
				}

				.gallery-grid .tile img {
					width: 100%;
					height: 100%;
					object-fit: cover;
					transition: transform 0.3s ease;
				}

				.gallery-grid .tile img:hover {
					transform: scale(1.08);
				}

				.gallery-platform::after {
					content: "";
					position: absolute;
					left: 50%;
					transform: translateX(-50%);
					bottom: -86px;
					width: 95%;
					height: 120px;
					background: linear-gradient(#ededf1, #e7e7ea);
					border-radius: 50%;
					z-index: -2;
				}

				.gallery-platform::before {
					content: "";
					position: absolute;
					left: 50%;
					transform: translateX(-50%);
					bottom: -110px;
					width: 100%;
					height: 36px;
					background: rgba(0, 0, 0, 0.06);
					border-radius: 50%;
					z-index: -3;
				}

				/* ---------- Footer (orange block) ---------- */
				footer {
					margin-top: 48px;
					background: var(--accent);
					padding: 32px 24px;
					color: #fff;
					border-top-left-radius: 20px;
					border-top-right-radius: 20px;
				}

				.footer-grid {
					display: flex;
					gap: 30px;
					justify-content: space-between;
					flex-wrap: wrap;
					align-items: flex-start
				}

				.footer-col {
					min-width: 160px
				}

				.footer-col h4 {
					font-weight: 800;
					margin-bottom: 12px
				}

				.footer-col ul {
					list-style: none;
					padding: 0
				}

				.footer-col li {
					margin-bottom: 8px;
					font-weight: 600
				}

				/* ---------- Responsive ---------- */
				@media (max-width:1000px) {
					.gallery-grid {
						grid-template-columns: repeat(3, 1fr)
					}

					.user-actions-grid {
						grid-template-columns: repeat(2, 1fr)
					}
				}

				@media (max-width:680px) {
					header {
						padding: 0 16px
					}

					.hero-platform h1 {
						font-size: 34px
					}

					.gallery-grid {
						grid-template-columns: repeat(2, 1fr)
					}

					.user-actions-grid {
						grid-template-columns: 1fr
					}

					nav ul {
						display: none
					}

					.header-buttons {
						display: flex;
						gap: 8px;
					}
				}

				/*----------scroll suave desplazamiento para el menu----------------*/
				html {
					scroll-behavior: smooth;
				}

				section {
					scroll-margin-top: 100px;
				}
    </style>
</head>

<body>

    <header th:fragment="header">
        <div class="brand">
            <div class="logo"><i class="fa-solid fa-paw"></i></div>
            <span>Arriba Patitas</span>
        </div>
        <nav>
            <ul>
                <li><a th:href="@{/menu}#acciones">SERVICIOS</a></li>
                <li><a th:href="@{/productos}">PRODUCTOS</a></li>
                </ul>
        </nav>
        </header>

    <footer th:fragment="footer">
        <div class="footer-grid">
            </div>
    </footer>

    <div th:fragment="chatbot" th:if="${#authorization.expression('isAuthenticated()')}">
        <div id="chat-button" onclick="toggleChat()">...</div>
        <div id="chat-window">...</div>
        <script>
            // Pega aquí el JavaScript del chatbot
        </script>
    </div>

</body>
</html>
