<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Perfil de Usuario</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-light-start: #FF9800;
            --accent: #FF5722;
            --text-dark: #333333;
            --form-bg: rgba(255, 152, 0, 0.9);
            --white: #ffffff; 
            --dark-button: #444444; 
            --text-light: var(--white);
            --bg-yellow-corner: #FFC107;
            --fallback-grey: #f0f0f0;
            --main-title-dark: #3a3a3a;
            --header-bg: #ffffff;
            --profile-card-bg: #FF9800;
            --input-bg: #ffffff;
            --input-text: #333333;
            --button-bg-orange: #FF9800;
            --button-hover-orange: #FF8F00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, var(--bg-light-start), var(--accent));
            color: var(--text-dark);
            padding: 0;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            height: 60px;
            background-color: var(--header-bg);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo i {
            color: var(--bg-light-start);
            font-size: 24px;
        }

        .header-brand-text {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 18px;
        }

        .header-nav {
            display: flex;
            gap: 30px;
        }

        .header-nav a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .header-nav a:hover {
            color: var(--bg-light-start);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            color: var(--text-dark);
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }
        .header-icon:hover {
            background-color: #f0f0f0;
        }

        .header-logout {
            background-color: var(--bg-light-start);
            color: var(--white);
            border-radius: 8px;
            width: auto;
            padding: 8px 15px;
            font-size: 16px;
        }
        .header-logout i {
            color: var(--white);
        }
        .header-logout:hover {
            background-color: var(--button-hover-orange);
        }

        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 20px;
            width: 100%;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 30px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(30px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .profile-card h2 {
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--dark-button);
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--white);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .profile-avatar i {
            font-size: 45px;
        }
        
        .profile-info {
            text-align: left;
            margin-top: 20px;
        }

        .info-group {
            margin-bottom: 18px;
        }

        .info-label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .info-value-input {
            width: 100%;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: default;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            border-radius: 8px;
            background-color: var(--button-bg-orange);
            color: var(--white);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
        }

        .btn-volver:hover {
            background-color: var(--button-hover-orange);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            header {
                padding: 0 15px;
            }
            .header-nav {
                gap: 15px;
            }
            .header-brand-text {
                font-size: 16px;
            }
            .header-nav a {
                font-size: 13px;
            }
            .profile-card {
                padding: 25px 30px;
                max-width: 90%;
            }
            .profile-card h2 {
                font-size: 20px;
            }
            .profile-avatar {
                width: 70px;
                height: 70px;
                margin-bottom: 20px;
            }
            .profile-avatar i {
                font-size: 35px;
            }
            .info-group {
                margin-bottom: 15px;
            }
            .info-label {
                font-size: 12px;
            }
            .info-value-input {
                font-size: 14px;
                padding: 8px 12px;
            }
            .btn-volver {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="#" class="header-logo"><i class="fas fa-paw"></i></a>
            <span class="header-brand-text">PATITAS FELICES</span>
        </div>
        <nav class="header-nav">
            <a th:href="@{/menu}">SERVICIOS</a>
            <a th:href="@{/mis-citas}">MIS CITAS</a>
        </nav>
        <div class="header-right">
            <a th:href="@{/miperfil}" class="header-icon"><i class="fas fa-user"></i></a>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="header-icon header-logout"><i class="fas fa-sign-out-alt"></i></button>
            </form>
        </div>
    </header>

    <main>
        <div class="profile-card">
            <h2>PERFIL</h2>
            
            <div class="profile-avatar">
                <i class="fas fa-user"></i>
            </div>

            <div class="profile-info">
                <div class="info-group">
                    <label class="info-label">Correo Electrónico:</label>
                    <input type="text" class="info-value-input" th:value="${usuario.email}" readonly />
                </div>
                <div class="info-group">
                    <label class="info-label">Nombre:</label>
                    <input type="text" class="info-value-input" th:value="${usuario.cliente.nombre}" readonly />
                </div>
                <div class="info-group">
                    <label class="info-label">Teléfono:</label>
                    <input type="text" class="info-value-input" th:value="${usuario.cliente.telefono}" readonly />
                </div>
                <div class="info-group">
                    <label class="info-label">Dirección:</label>
                    <input type="text" class="info-value-input" th:value="${usuario.cliente.direccion}" readonly />
                </div>
            </div>

            <a th:href="@{/menu}" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver</a>
        </div>
    </main>
</body>
</html>
