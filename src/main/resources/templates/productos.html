<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tienda de Productos | SuperPet</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/productos.css}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- ================= NAV ================= -->
<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- ================= CONTENIDO ================= -->
<main class="contenedor">

    <h1 class="titulo">Tienda de Productos</h1>
    <p class="subtitulo">
        Encuentra alimentos, accesorios y medicamentos para tu mascota
    </p>

    <!-- ================= GRID DE PRODUCTOS ================= -->
    <section class="productos-grid">

        <div class="producto-card"
             th:each="p : ${productos}">

            <div class="producto-icon">
                <i class="fas fa-paw"></i>
            </div>

            <h3 th:text="${p.nombre}">Nombre Producto</h3>

            <p class="descripcion"
               th:text="${p.descripcion}">
                Descripción del producto
            </p>

            <div class="info">
                <span class="precio"
                      th:text="'S/ ' + ${p.precio}">
                    S/ 0.00
                </span>

                <span class="stock"
                      th:text="'Stock: ' + ${p.stock}">
                    Stock: 0
                </span>
            </div>

			<!-- si este es el btn xd-->
			<a class="btn-detalle"
			      th:href="@{/productos/{id}(id=${p.id})}">
			       Ver detalle
			   </a>
        </div>

    </section>

</main>

<div th:replace="~{fragments/chatbot :: chatbot}"></div>
<!-- FOOTER -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
